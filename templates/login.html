<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="植物医生 - 登录">
    <title>植物医生 · 登录</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="auth-page">
    <i class="fas fa-leaf auth-bg-leaf float" style="top:8%;left:6%;"></i>
    <i class="fas fa-leaf auth-bg-leaf float" style="bottom:10%;right:8%;animation-delay:1s;"></i>

    <div class="auth-card fade-in">
        <div class="auth-logo">
            <i class="fas fa-leaf icon"></i>
            <h1>植物医生</h1>
            <p>AI 植物病害识别与防治</p>
        </div>

        <form id="loginForm" method="POST" action="/login">
            <div class="form-group">
                <label class="form-label"><i class="fas fa-user"></i> 用户名</label>
                <input type="text" name="username" class="form-input" placeholder="请输入用户名" required autofocus>
            </div>
            <div class="form-group">
                <label class="form-label"><i class="fas fa-lock"></i> 密码</label>
                <input type="password" name="password" class="form-input" placeholder="请输入密码" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block btn-lg">
                <i class="fas fa-sign-in-alt"></i> 登录
            </button>
        </form>

        <div class="auth-foot">
            还没有账号？ <a href="/register">立即注册</a>
        </div>

        {% if error %}
        <div class="alert alert-danger mt-4"><i class="fas fa-exclamation-circle icon"></i><div>{{ error }}</div></div>
        {% endif %}

        <p class="text-tiny text-muted text-center mt-4">© 植物医生 · 让农业更智能</p>
    </div>

    <script src="/static/js/main.js"></script>
</body>
</html>
