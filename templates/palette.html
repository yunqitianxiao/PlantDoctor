<!-- ============================================================
     命令面板（Command Palette）
     按 Ctrl / Cmd + K 打开，输入页面或操作名称快速跳转
     ============================================================ -->
<div class="palette-overlay" id="paletteOverlay" hidden aria-hidden="true">
    <div class="palette" role="dialog" aria-label="命令面板">
        <div class="palette-search">
            <i class="fas fa-search"></i>
            <input type="text" id="paletteInput" class="palette-input"
                   placeholder="输入页面名或操作，如：诊断、导出、百科…"
                   autocomplete="off" spellcheck="false" maxlength="60">
            <kbd class="palette-kbd">ESC</kbd>
        </div>
        <div class="palette-list" id="paletteList" tabindex="-1"></div>
        <div class="palette-footer">
            <span><kbd>↑</kbd><kbd>↓</kbd> 移动</span>
            <span><kbd>↵</kbd> 打开</span>
            <span><kbd>ESC</kbd> 关闭</span>
        </div>
    </div>
</div>
